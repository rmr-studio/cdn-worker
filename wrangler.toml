name = "cdn-worker"
main = "src/index.ts"
compatibility_date = "2025-02-21"

[[r2_buckets]]
binding = "BUCKET"
bucket_name = "riven-assets"

[[routes]]
pattern = "cdn.riven.software" 
custom_domain = true 

[vars]
ALLOWED_ORIGINS = "*"
ALLOWED_REFERERS = "*"

[observability]
enabled = true
head_sampling_rate = 1

[observability.logs]
enabled = true
head_sampling_rate = 1
persist = true
invocation_logs = true

[observability.traces]
enabled = false
persist = true
head_sampling_rate = 1